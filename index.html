<style>
:root{--bg1:#fdf4f8;--bg2:#f8eaf0;--card:rgba(255,255,255,.78);--ink:#5c2a3a;--wine:#7b3548;--accent:#a46b8f;--rose:#e2b6cc;--peach:#e8cbc2;--mist:#b8c9cf;--muted:#8a6a76;--onwine:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg1);background-image:linear-gradient(170deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;font-weight:300;line-height:1.6;text-align:center}
.wrap{max-width:460px;margin:0 auto;padding:20px 18px 40px}
.lang{display:flex;justify-content:flex-end;gap:6px}
.lang button{font:500 12px 'Montserrat',sans-serif;border:1px solid var(--rose);background:transparent;color:var(--accent);padding:5px 12px;border-radius:20px;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--onwine);border-color:var(--accent)}
.kick{letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--accent);margin:22px 0 0}
h1{font:italic 500 54px/1.1 'Playfair Display',Georgia,serif;color:var(--wine);margin:4px 0 0}
.age{font:italic 500 34px 'Playfair Display',Georgia,serif;color:var(--accent);margin:0}
.when{margin:10px 0 0;font-weight:400;letter-spacing:.06em}
.photo{display:block;width:78%;max-width:300px;aspect-ratio:4/5;object-fit:cover;object-position:center 40%;margin:20px auto 6px;border-radius:999px 999px 28px 28px;border:6px solid #fff;box-shadow:0 8px 28px rgba(164,107,143,.28)}
.cd{display:flex;justify-content:center;gap:10px;margin:14px 0 0}
.cd div{background:var(--card);border-radius:14px;padding:8px 0;width:74px}
.cd b{display:block;font:500 26px 'Playfair Display',Georgia,serif;color:var(--wine)}
.cd span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.card{background:var(--card);border-radius:22px;padding:26px 20px;margin:26px 0 0;box-shadow:0 6px 24px rgba(164,107,143,.12)}
h2{font:italic 500 28px 'Playfair Display',Georgia,serif;color:var(--wine);margin:0 0 10px}
.orn{color:var(--accent);letter-spacing:.4em;margin:12px 0}
.sign{font:italic 500 22px 'Playfair Display',Georgia,serif;color:var(--wine);margin:6px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
.grid div{background:var(--bg1);border-radius:14px;padding:12px 14px}
.grid small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grid .full{grid-column:1/-1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:20px;font-size:13px}
.cal i{font-style:normal;padding:6px 0;border-radius:50%}
.cal .h{color:var(--muted);font-size:11px}
.cal .d{background:var(--wine);color:var(--onwine);font-weight:500}
.cal-t{margin:22px 0 0;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.btn{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:30px;background:var(--wine);color:var(--onwine);text-decoration:none;font:500 14px 'Montserrat',sans-serif;border:0;cursor:pointer}
.btn.alt{background:transparent;color:var(--wine);border:1.5px solid var(--rose)}
input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--rose);background:var(--bg1);color:var(--ink);font:400 15px 'Montserrat',sans-serif;margin:8px 0 6px}
.rs{display:flex;flex-direction:column;gap:8px}
.rs .btn{margin:0;width:100%}
.foot{margin-top:30px;color:var(--muted);font-size:13px}
</style>
